name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip newest project zip
        run: |
          latest=""
          latest_t=0
          for f in *.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -gt "$latest_t" ]; then latest_t=$t; latest="$f"; fi
          done
          echo "Using: $latest" | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -o "$latest" -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build
        working-directory: proj
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -B1 -A3 'error:' build.log | head -150 > errs.txt
            if [ ! -s errs.txt ]; then tail -n 60 build.log > errs.txt; fi
            { echo '### Build errors'; echo '```'; cat errs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: fxmod-jar
          path: proj/build/libs/*.jar
